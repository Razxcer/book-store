services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        container_name: bookstore_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - bookstore_net

    nginx:
        image: nginx:alpine
        container_name: bookstore_nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - bookstore_net

    postgres:
        image: postgres:17-alpine
        container_name: bookstore_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: bookstore
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: secret
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - bookstore_net

    redis:
        image: redis:alpine
        container_name: bookstore_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - bookstore_net

networks:
    bookstore_net:
        driver: bridge

volumes:
    pgdata:
